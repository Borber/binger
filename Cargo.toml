[package]
name = "binger"
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
description = "Keyboard-driven pointer selection for wlroots Wayland compositors"
authors = ["Borber"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/borber/binger"
keywords = ["wayland", "wlroots", "hyprland", "pointer", "keyboard"]
categories = ["command-line-utilities"]
exclude = [".github/", "packaging/"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[features]
default = ["wayland-backend"]
wayland-backend = [
    "dep:fontdb",
    "dep:fontdue",
    "dep:smithay-client-toolkit",
    "dep:wayland-client",
    "dep:wayland-protocols-wlr",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.2"

# Disabling default features lets the core build without Wayland dependencies.
fontdb = { version = "0.24", optional = true }
fontdue = { version = "0.9", optional = true }
smithay-client-toolkit = { version = "0.21.1", optional = true }
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }

